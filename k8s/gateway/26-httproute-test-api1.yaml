# 파일: 26-httproute-test-api1.yaml
# 역할: /test/api1 프리픽스 라우팅 + URLRewrite + x-model-id 강제 세팅 후 fastapi-greet로 전달

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: psm-llm-gateway-test-api1
  namespace: envoy-ai-gateway-system
spec:
  parentRefs:
    - name: psm-llm-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/api1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-model-id
                value: model-1
      backendRefs:
        - name: fastapi-greet
          namespace: uplus-mready-model
          port: 8000
